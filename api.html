<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ahmad Bhai - API Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --accent: #8646B4; --glass: rgba(255, 255, 255, 0.08); --text: #f1f5f9; }
        body { margin: 0; font-family: 'Poppins', sans-serif; background: radial-gradient(circle at top right, #1e1b4b, #0f172a); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .container { width: 90%; max-width: 420px; background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 30px; padding: 30px; text-align: center; box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6); box-sizing: border-box; }
        
        h2 { color: var(--accent); margin-bottom: 5px; font-size: 1.6rem; text-shadow: 0 0 15px rgba(134, 70, 180, 0.4); }
        .sub-text { font-size: 0.75rem; opacity: 0.6; margin-bottom: 25px; letter-spacing: 2px; }

        .api-box { background: rgba(0,0,0,0.3); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 15px; position: relative; }
        .label { font-size: 10px; color: var(--accent); text-align: left; display: block; margin-bottom: 5px; font-weight: bold; }
        
        .row { display: flex; gap: 8px; align-items: center; }
        .input-box { flex: 1; background: transparent; border: none; color: #00ffaa; font-family: monospace; font-size: 0.85rem; outline: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .copy-btn { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; transition: 0.3s; font-size: 0.8rem; }
        .copy-btn:hover { transform: scale(1.1); }

        .btn-main { width: 100%; padding: 15px; border: none; border-radius: 12px; background: linear-gradient(45deg, #8646B4, #5E177D); color: white; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        .btn-main:hover { box-shadow: 0 0 20px var(--accent); }
        .btn-del { background: #ef4444; margin-top: 10px; font-size: 0.8rem; padding: 10px; display: none; }

        .code-area { background: #000; padding: 10px; border-radius: 10px; font-size: 10px; text-align: left; margin-top: 15px; color: #94a3b8; border: 1px solid #222; max-height: 80px; overflow-y: auto; word-break: break-all; }
    </style>
</head>
<body>

<div class="container">
    <h2>API Hub</h2>
    <p class="sub-text">MAGIC SCRIPTS PORTAL</p>

    <div class="api-box">
        <span class="label">YOUR PRIVATE API KEY</span>
        <div class="row">
            <input type="text" id="keyVal" class="input-box" readonly placeholder="No Key Found">
            <button class="copy-btn" onclick="copyIt('keyVal')"><i class="fa-solid fa-copy"></i></button>
        </div>
    </div>

    <div class="api-box">
        <span class="label">ENDPOINT URL</span>
        <div class="row">
            <input type="text" id="apiLink" class="input-box" readonly placeholder="Generate key first">
            <button class="copy-btn" onclick="copyIt('apiLink')"><i class="fa-solid fa-copy"></i></button>
        </div>
    </div>

    <button class="btn-main" id="genBtn" onclick="action('gen')">🚀 GENERATE NEW KEY</button>
    <button class="btn-main btn-del" id="delBtn" onclick="action('del')">🗑 DELETE KEY</button>

    <div class="code-area" id="codePrev">
        // Documentation:<br>
        GET /api/download?key={key}&url={url}
    </div>
</div>

<script>
    window.onload = () => {
        const saved = localStorage.getItem('ahmad_key');
        if(saved) refresh(saved);
    }

    function action(type) {
        if(type === 'gen') {
            const newKey = 'AB-' + Math.random().toString(36).substr(2, 9).toUpperCase();
            localStorage.setItem('ahmad_key', newKey);
            refresh(newKey);
        } else {
            if(confirm("Delete API access?")) {
                localStorage.removeItem('ahmad_key');
                refresh(null);
            }
        }
    }

    function refresh(k) {
        const urlBase = window.location.origin + "/api/download";
        document.getElementById('keyVal').value = k || "";
        document.getElementById('apiLink').value = k ? `${urlBase}?key=${k}&url=` : "";
        document.getElementById('genBtn').style.display = k ? 'none' : 'block';
        document.getElementById('delBtn').style.display = k ? 'block' : 'none';
        document.getElementById('codePrev').innerText = k ? `Final Endpoint:\n${urlBase}?key=${k}&url=YOUR_URL` : "// Generate key to see endpoint";
    }

    function copyIt(id) {
        const val = document.getElementById(id).value;
        if(!val) return;
        navigator.clipboard.writeText(val);
        const btn = document.querySelector(`#${id} + .copy-btn`);
        btn.innerHTML = '<i class="fa-solid fa-check"></i>';
        setTimeout(() => btn.innerHTML = '<i class="fa-solid fa-copy"></i>', 2000);
    }
</script>

</body>
</html>
